# Findings in package-lock.json that cannot be fixed yet, each with the evidence and an end date.
# Remove an entry as soon as a fixed version can be installed without a major update.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-18
reason = """
minimatch 10.2.6 and 9.0.9 (CVE-2026-118764, CWE-405, GitHub severity moderate): the fix exists only in 11.0.1, a
major release that removes makeRe(), the AST class and the RegExp entries of Minimatch.set, which glob 9 to 13 rely on.
No dependent allows 11 yet: swagger-jsdoc 6.3.0 (latest) pins glob 11.1.0 (minimatch ^10.1.1); eslint-plugin-sonarjs,
test-exclude and glob 13 (dev only) declare ^10 or ^9. The amplification needs an attacker-controlled glob pattern.
The only runtime use is swagger-jsdoc in src/docs/swagger.js with three hard-coded route paths; all other patterns
come from the repository's own configuration. Review by the end date, or earlier when the dependents allow 11.
"""

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-02-18
reason = """
glob 10.5.0, 11.1.0 and 13.0.6 (CVE-2026-118773, GitHub severity moderate): an aborted walk keeps reading directories.
The fix exists only in glob 14.0.2, a major release, and no dependent allows it yet (swagger-jsdoc 6.3.0 pins 11.1.0;
jest 30.5.2 and test-exclude 7 need ^13 or ^10). The flaw only matters to callers that bound a walk with an
AbortSignal. At runtime swagger-jsdoc calls glob.sync() without a signal on three hard-coded paths, so no request can
trigger the extra traversal; the dev copies (jest, test-exclude) only walk this repository in tests and CI.
Review by the end date, or earlier when the dependents allow glob 14.
"""
