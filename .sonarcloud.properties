# SonarQube Cloud Automatic Analysis reads this file; sonar-project.properties is for scanner-based setups.
sonar.sources=src,scripts,docker
sonar.tests=tests
sonar.exclusions=**/node_modules/**,coverage/**,reports/**,playwright-report/**,test-results/**
# Every language file repeats the same keys by design, so they are not checked for duplication.
sonar.cpd.exclusions=src/locales/**
