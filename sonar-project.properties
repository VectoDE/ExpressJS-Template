# SonarQube / SonarQube Cloud. Set sonar.projectKey (and sonar.organization for the cloud) for your project.
sonar.projectKey=expressjs-template
sonar.projectName=Express.js Template
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,docker
sonar.tests=tests
sonar.exclusions=**/node_modules/**,coverage/**,reports/**,playwright-report/**,test-results/**

# Written by `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Every language file repeats the same keys by design, so they are not checked for duplication.
sonar.cpd.exclusions=src/locales/**
