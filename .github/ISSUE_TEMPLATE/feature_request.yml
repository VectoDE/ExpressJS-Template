name: Feature request
description: Suggest an improvement for the template.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Does the change touch authentication, sessions, stored data or headers?
