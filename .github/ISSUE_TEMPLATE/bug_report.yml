name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems belong in a [private advisory](https://github.com/VectoDE/ExpressJS-Template/security/advisories/new), not here.
        Remove secrets, tokens and personal data from logs before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm ci
        2. npm run dev
        3. POST /v1/auth/login with ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Template version
      placeholder: 3.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 24.21.0 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: text
