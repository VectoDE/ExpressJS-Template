name: Performance

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per endpoint
        type: number
        default: 5
  schedule:
    - cron: '7 2 * * 0'
  pull_request:
    paths:
      - 'src/**'
      - 'package-lock.json'
      - 'tests/performance/**'

permissions:
  contents: read

jobs:
  load-test:
    name: Load test every endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shared runners vary in speed: on pull requests the result is a hint, the weekly run is the reference.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:perf
        env:
          PERF_DURATION: ${{ inputs.duration || '5' }}
      - if: always()
        run: cat reports/performance.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-report
          path: reports/
          retention-days: 30
