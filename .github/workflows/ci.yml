name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - if: matrix.node == 26
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  databases:
    name: Database (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MongoDB
            image: mongo:9.0@sha256:bac22ea7710d774103dcad3ec8ac13cba1eb378f488e3ce8a6b3a1adf2ba9dcc
            port: 27017
            health: mongosh --quiet --eval 'db.runCommand({ping:1})'
            url: mongodb://127.0.0.1:27017
          - name: PostgreSQL
            image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
            port: 5432
            # Over TCP: during initialisation a temporary server answers on the socket only, so a socket check
            # reports ready before port 5432 is open.
            health: pg_isready -h 127.0.0.1 -U postgres
            url: postgres://postgres:ci-only-Passw0rd@127.0.0.1:5432/app
          - name: MySQL
            image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -uroot -pci-only-Passw0rd
            url: mysql://root:ci-only-Passw0rd@127.0.0.1:3306/app
          - name: MariaDB
            image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            url: mariadb://root:ci-only-Passw0rd@127.0.0.1:3306/app
          - name: SQL Server
            image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
            port: 1433
            health: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ci-only-Passw0rd -Q 'SELECT 1'
            url: mssql://sa:ci-only-Passw0rd@127.0.0.1:1433/master?trustServerCertificate=true
          - name: Oracle
            image: gvenzl/oracle-free:23-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
            port: 1521
            health: healthcheck.sh
            url: oracle://app:ci-only-Passw0rd@127.0.0.1:1521/FREEPDB1
    services:
      db:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        # Throwaway credentials for a container that lives only as long as this job. Every image reads its own.
        env:
          POSTGRES_PASSWORD: ci-only-Passw0rd
          POSTGRES_DB: app
          MYSQL_ROOT_PASSWORD: ci-only-Passw0rd
          MYSQL_DATABASE: app
          MARIADB_ROOT_PASSWORD: ci-only-Passw0rd
          MARIADB_DATABASE: app
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ci-only-Passw0rd
          ORACLE_PASSWORD: ci-only-Passw0rd
          APP_USER: app
          APP_USER_PASSWORD: ci-only-Passw0rd
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # harden-runner restarts the Docker daemon to set up its DNS proxy, which stops the service container that GitHub
      # started before the first step. Start it again, then wait until its health check passes and the mapped port
      # accepts connections from the runner.
      - name: Make sure the database is up
        env:
          DB_PORT: ${{ matrix.port }}
        run: |
          # The service is the only container in this job.
          container=$(docker ps --all --quiet)
          test "$(echo "$container" | wc -w)" -eq 1
          docker start "$container" > /dev/null
          for _ in $(seq 100); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$status" = healthy ] && (echo > "/dev/tcp/127.0.0.1/$DB_PORT") 2> /dev/null; then exit 0; fi
            sleep 3
          done
          echo "The database did not come up: $status"
          docker logs --tail 50 "$container"
          exit 1
      - run: npm test
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
      - name: A generated resource works on this database
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
        run: |
          npm run generate -- note
          npm test -- tests/integration/note.test.js
          npx eslint --max-warnings 0 src tests

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e:install
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm audit signatures
      - name: License allow-list and up-to-date third-party notices
        run: |
          npm run licenses
          git diff --exit-code docs/third-party-notices.md

  worker:
    name: Cloudflare demo (local Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # The committed D1 migrations must match the Knex migrations, and the bundle must build.
      - run: npm run build:worker -- --check
      - run: npm run build:worker
      # Runs the Worker in workerd with a local D1 database and walks through the main flows. The secrets are random
      # values that exist only for this job.
      - name: Run the Worker and the smoke test
        run: |
          {
            echo "APP_URL=https://localhost:8787"
            for name in JWT_SECRET SESSION_SECRET ENCRYPTION_KEY; do echo "$name=$(openssl rand -hex 32)"; done
          } > .dev.vars
          npx wrangler d1 migrations apply DB --local
          npx wrangler d1 execute DB --local --file worker-dist/seed.sql
          npx wrangler dev --local --local-protocol https --port 8787 > wrangler.log 2>&1 &
          for _ in $(seq 60); do curl -ksf -o /dev/null https://127.0.0.1:8787/ && break; sleep 2; done
          NODE_TLS_REJECT_UNAUTHORIZED=0 node scripts/worker-smoke.js https://127.0.0.1:8787 || { cat wrangler.log; exit 1; }

  reuse:
    name: License and copyright headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every file names its license and copyright holder, in an SPDX header or in REUSE.toml.
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  reproducible:
    name: Reproducible source archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release ships a source archive made by git archive. Two separate clones in different directories must
      # give the same archive, byte for byte, so anyone can rebuild it and compare it with the signed one.
      - name: Build the archive twice and compare
        run: |
          git clone --quiet --no-local . "$RUNNER_TEMP/second"
          for dir in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/second"; do
            (cd "$dir" && git archive --format=tar.gz --prefix=expressjs-template/ -o "$RUNNER_TEMP/$(basename "$dir").tar.gz" HEAD)
          done
          first=$(sha256sum "$RUNNER_TEMP/$(basename "$GITHUB_WORKSPACE").tar.gz" | cut -d' ' -f1)
          second=$(sha256sum "$RUNNER_TEMP/second.tar.gz" | cut -d' ' -f1)
          echo "first:  $first" && echo "second: $second"
          test "$first" = "$second"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: expressjs-template:ci
      - name: Container starts and refuses an insecure configuration
        run: |
          if docker run --rm -e NODE_ENV=production expressjs-template:ci > output.txt 2>&1; then
            echo "Container started without secrets" && exit 1
          fi
          # Any other failure (a missing module, a syntax error) must not count as the expected refusal.
          grep -q "Insecure configuration" output.txt || { cat output.txt; exit 1; }
          test "$(docker run --rm --entrypoint id expressjs-template:ci -u)" != "0"
