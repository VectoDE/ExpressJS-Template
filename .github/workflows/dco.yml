# Every commit in a pull request must be signed off (Developer Certificate of Origin): the author certifies the right
# to submit it under the project's license. Commits by bots such as Dependabot and merges that GitHub itself made (for
# example "Update branch", verified and committed by web-flow) are exempt: bots cannot sign off, and such a merge adds
# no authorship of its own.
name: DCO

on: pull_request

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check every commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          missing=0
          while IFS=$'\t' read -r sha login email web_merge; do
            case "$login" in *'[bot]') continue ;; esac
            if [ "$web_merge" = 1 ]; then
              echo "${sha:0:7} is a merge made by GitHub, skipped"
              continue
            fi
            message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .commit.message)"
            if printf '%s\n' "$message" | grep -i '^Signed-off-by:' | grep -qiF "<$email>"; then
              echo "${sha:0:7} signed off by $email"
            else
              echo "::error::Commit ${sha:0:7} has no 'Signed-off-by: ... <$email>' line. Amend it with git commit -s."
              missing=1
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | [.sha, (.author.login // "-"), .commit.author.email, (if (.parents | length) > 1 and .committer.login == "web-flow" and .commit.verification.verified then 1 else 0 end)] | @tsv')
          exit "$missing"
